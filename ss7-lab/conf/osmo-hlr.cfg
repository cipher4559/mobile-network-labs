! OsmoHLR - GSUP server + subscriber database (loopback only)
log stderr
 logging filter all 1
 logging color 0
 logging print category 1
 logging timestamp 1
 logging level set-all notice
line vty
 no login
 bind 127.0.0.1
ctrl
 bind 127.0.0.1
hlr
 database /lab/run/hlr.db
 gsup
  bind ip 127.0.0.1
 ussd route prefix *#100# internal own-msisdn
 ussd route prefix *#101# internal own-imsi
