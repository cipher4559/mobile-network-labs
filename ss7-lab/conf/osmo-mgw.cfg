! OsmoMGW - MGCP media gateway endpoint (loopback only, no real RTP peer)
log stderr
 logging filter all 1
 logging color 0
 logging print category 1
 logging timestamp 1
 logging level set-all notice
line vty
 no login
 bind 127.0.0.1
mgcp
 bind ip 127.0.0.1
 bind port 2427
 rtp bind-ip 127.0.0.1
 rtp port-range 4002 16000
 number endpoints 16
